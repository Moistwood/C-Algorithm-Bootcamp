<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ 算法竞赛特训 · 从零基础到能拿奖</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/style2.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title">
        <span class="brand-mark">A+</span>
        <span>C++ 算法竞赛特训</span>
      </div>
      <div class="brand-sub">从零基础 → 竞赛拿奖 · 完整知识体系</div>
    </div>

    <div class="modes">
      <button class="mode-btn active" data-mode="learn">知识学习</button>
      <button class="mode-btn" data-mode="practice">题目练习</button>
      <button class="mode-btn" data-mode="runner">代码运行</button>
    </div>

    <div class="sidebar-scroll" id="sidebarList"></div>

    <div class="sidebar-foot">
      <div class="progress-line">
        <span>总进度</span>
        <span><b id="progressPct">0%</b></span>
      </div>
      <div class="bar"><i id="progressBar"></i></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-toggle" id="mobileToggle">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-spacer"></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索知识点…" autocomplete="off">
      </div>
      <div class="user-bar" id="userBar"></div>
      <button class="icon-btn" id="resetBtn" title="清空本机学习进度">重置</button>
    </header>

    <div class="content" id="content"></div>
  </main>

</div>
